<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>POC-1 びょうがせいのうテスト</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦕</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #app,
      #app canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .panel {
        position: fixed;
        background: rgba(20, 25, 35, 0.72);
        color: #fff;
        border-radius: 12px;
        padding: 10px 14px;
        line-height: 1.5;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stats {
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        font-size: 13px;
      }
      #fps {
        font-size: 42px;
        font-weight: 700;
        line-height: 1.1;
      }
      #stats .unit {
        font-size: 13px;
        opacity: 0.8;
      }
      #hint {
        top: max(10px, env(safe-area-inset-top));
        right: 10px;
        font-size: 12px;
        max-width: 46vw;
        text-align: right;
      }
      #buttons {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }
      #buttons button {
        min-height: 52px;
        min-width: 108px;
        padding: 10px 16px;
        border: none;
        border-radius: 14px;
        background: rgba(20, 25, 35, 0.78);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      #buttons button:active {
        background: rgba(70, 110, 180, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="stats" class="panel">
      <span id="fps">--</span> <span class="unit">FPS</span>
      <div>1フレーム <span id="ms">--</span> ms / さいてい <span id="fps-min">--</span> FPS</div>
      <div id="info">--</div>
      <div>はじめの表示まで <span id="load-time">--</span> びょう</div>
    </div>

    <div id="hint" class="panel">
      POC-1 びょうが性能テスト<br />
      ゆび1本ドラッグ: カメラ回転<br />
      ゆび2本ピンチ: ズーム
    </div>

    <div id="buttons">
      <button id="btn-shadow" type="button">かげ ON</button>
      <button id="btn-dpr" type="button">がしつ 2.0x</button>
      <button id="btn-anim" type="button">アニメ ON</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
