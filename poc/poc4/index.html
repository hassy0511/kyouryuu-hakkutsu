<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>POC-4 カセキ島スライス</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #app,
      #app canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .hidden {
        display: none !important;
      }
      .panel {
        position: fixed;
        background: rgba(20, 25, 35, 0.72);
        color: #fff;
        border-radius: 12px;
        padding: 10px 14px;
        line-height: 1.5;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stamina {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(44vw, 300px);
        background: rgba(20, 25, 35, 0.72);
        color: #fff;
        border-radius: 12px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        pointer-events: none;
      }
      #stamina .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      #stamina .track {
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
      #stamina-bar {
        height: 100%;
        width: 100%;
        background: #6adf6a;
        border-radius: 999px;
        transition:
          width 0.2s,
          background 0.3s;
      }
      #msg {
        position: fixed;
        top: 17%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 25, 35, 0.82);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        padding: 12px 22px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
        white-space: nowrap;
        max-width: 96vw;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 20;
      }
      #msg.show {
        opacity: 1;
      }
      #fps-panel {
        bottom: max(10px, env(safe-area-inset-bottom));
        left: 10px;
        font-size: 11px;
        opacity: 0.8;
      }
      #species-list {
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        font-size: 14px;
      }
      #species-list .sp {
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }
      #field-help {
        top: max(10px, env(safe-area-inset-top));
        right: 10px;
        font-size: 12px;
        max-width: 42vw;
        text-align: right;
      }
      .site-alert {
        position: fixed;
        transform: translate(-50%, -100%);
        font-size: 36px;
        pointer-events: none;
        display: none;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4));
        animation: bob 0.9s ease-in-out infinite alternate;
        z-index: 5;
      }
      @keyframes bob {
        from {
          margin-top: 0;
        }
        to {
          margin-top: -10px;
        }
      }
      #dig-progress {
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        font-size: 18px;
        font-weight: 700;
      }
      #dig-help {
        top: max(10px, env(safe-area-inset-top));
        right: 10px;
        font-size: 12px;
        max-width: 42vw;
        text-align: right;
      }
      button {
        border: 3px solid transparent;
        border-radius: 16px;
        background: rgba(20, 25, 35, 0.78);
        color: #fff;
        font-weight: 700;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      #dig-tools {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
      }
      #dig-tools button {
        min-height: 56px;
        min-width: 120px;
        padding: 10px 18px;
        font-size: 18px;
      }
      #dig-tools button.active {
        border-color: #ffd75e;
        background: rgba(70, 110, 180, 0.9);
      }
      #dig-btn-exit {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom));
        right: 10px;
        min-height: 48px;
        min-width: 96px;
        font-size: 14px;
      }
      #banner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(15, 20, 30, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s;
        z-index: 30;
        text-align: center;
      }
      #banner.show {
        opacity: 1;
      }
      #banner-title {
        background: #fffaf0;
        color: #3a3226;
        font-size: 26px;
        font-weight: 700;
        padding: 18px 30px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        max-width: 92vw;
      }
      #banner-sub {
        background: rgba(20, 25, 35, 0.8);
        color: #fff;
        font-size: 14px;
        padding: 8px 16px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="stamina">
      <div class="row"><span>げんき</span><span id="stamina-num">60</span></div>
      <div class="track"><div id="stamina-bar"></div></div>
    </div>
    <div id="msg"></div>
    <div id="fps-panel" class="panel">
      <span id="fps">--</span> FPS / <span id="ms">--</span> ms / さいてい
      <span id="fps-min">--</span>
    </div>

    <div id="field-ui">
      <div id="species-list" class="panel">
        <div class="sp"><b>スピノサウルス</b><span id="sp-spinosaurus">0/4</span></div>
        <div class="sp"><b>トリケラトプス</b><span id="sp-triceratops">0/4</span></div>
      </div>
      <div id="field-help" class="panel">
        タップ: あるく / しらべる<br />
        ゆび2本: カメラ<br />
        ⛺テント: げんき かいふく
      </div>
      <div id="alerts"></div>
    </div>

    <div id="dig-ui" class="hidden">
      <div id="dig-progress" class="panel">ホネ 0/2</div>
      <div id="dig-help" class="panel">
        ⛏️ ピッケル: はやいが きけん<br />
        🖌️ ブラシ: ゆっくり あんぜん<br />
        ゆび2本: カメラ
      </div>
      <div id="dig-tools">
        <button id="dig-btn-pick" type="button" class="active">⛏️ ピッケル</button>
        <button id="dig-btn-brush" type="button">🖌️ ブラシ</button>
      </div>
      <button id="dig-btn-exit" type="button">🏝️ もどる</button>
    </div>

    <div id="banner">
      <div id="banner-title"></div>
      <div id="banner-sub"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
